<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hành trình tài chính</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF4F1; --card:#FFFFFF; --ink:#12343B; --muted:#5B7177; --line:#D3E0DB;
  --spend:#C23B2E; --save:#1F7A55; --gold:#B8860B; --stock:#2B5FA8; --cash:#6B7C85; --debt:#9E1B32; --biz:#7A4FB0; --land:#8A5A2B;
  --warn:#C98A0B; --accent:#12343B; --accent-ink:#FFFFFF; --soft:#E2ECE8;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1C1F; --card:#16292D; --ink:#E4EFEC; --muted:#93AAA6; --line:#2A4247;
    --spend:#E8705F; --save:#4FBF8B; --gold:#E3B341; --stock:#6E9BE0; --cash:#9AAAB2; --debt:#F07A8C; --biz:#B08CE6; --land:#D19A62;
    --warn:#E8B23A; --accent:#E4EFEC; --accent-ink:#0E1C1F; --soft:#1E363B; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1C1F; --card:#16292D; --ink:#E4EFEC; --muted:#93AAA6; --line:#2A4247;
  --spend:#E8705F; --save:#4FBF8B; --gold:#E3B341; --stock:#6E9BE0; --cash:#9AAAB2; --debt:#F07A8C; --biz:#B08CE6; --land:#D19A62;
  --warn:#E8B23A; --accent:#E4EFEC; --accent-ink:#0E1C1F; --soft:#1E363B; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 10px;font-weight:700}
h3{font-size:.98rem;margin:18px 0 8px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--stock);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;width:100%;font-size:1rem}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.tag{font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
.tag.red{background:var(--spend);color:#fff} .tag.green{background:var(--save);color:#fff} .tag.violet{background:var(--biz);color:#fff}
.tag.nho{background:var(--soft)} .tag.vua{background:var(--warn);color:#fff} .tag.lon{background:var(--spend);color:#fff} .tag.quiz{background:var(--stock);color:#fff}

/* Start */
.hero{padding:28px 4px 18px}
.hero p{max-width:34em;margin:.6em 0 0;color:var(--muted)}
.hero .big{font-size:clamp(2rem,8vw,3.2rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:2px solid transparent;border-radius:12px;padding:12px 14px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.opt b{display:block} .opt span{font-size:.85rem;color:var(--muted)}
.group{margin-bottom:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.form label{font-size:.85rem;color:var(--muted);display:grid;gap:3px}
.form input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* Status */
.status{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.nw{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.timebar{height:6px;background:var(--soft);border-radius:3px;margin-top:14px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--ink)}
.mood{text-align:right}
.meter{width:120px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px;margin-left:auto}
.meter i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px}
.tile{border-left:4px solid var(--c);padding:6px 10px;background:var(--paper);border-radius:4px 10px 10px 4px}
.tile .v{font-weight:700}
.tile button{margin-top:2px;background:none;border:0;padding:0;font-size:.8rem;color:var(--muted);text-decoration:underline}

/* Ladder */
.ladder{display:flex;align-items:flex-end;gap:4px;height:120px;margin:4px 0 8px}
.rung{flex:1;background:var(--soft);border-radius:6px 6px 2px 2px;position:relative;display:flex;justify-content:center;align-items:flex-start}
.rung.on{background:color-mix(in srgb,var(--save) 45%,var(--soft))}
.rung.cur{background:var(--save)}
.rung .me{position:absolute;top:-26px;font-size:1.25rem}
.rung.start::after{content:"";position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink);opacity:.5}
.rungnames{display:flex;gap:4px;font-size:.62rem;color:var(--muted);line-height:1.2;margin-bottom:12px}
.rungnames span{flex:1;text-align:center}
.tiername{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.checks{display:grid;gap:6px;margin-top:12px}
.check{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:baseline;font-size:.9rem}
.check .dot{width:10px;height:10px;border-radius:50%;align-self:center}
.check .tip{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.priority{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--paper)}
.priority b{display:block;font-size:.8rem;opacity:.8;font-weight:600}

/* Plan */
.seg{display:flex;gap:6px;margin-bottom:4px}
.seg button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 4px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-of-type{border-bottom:0}
.row .name{font-weight:600}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.usebar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.usebar i{display:block;height:100%;background:var(--biz)}
.shop{display:grid;gap:8px;margin-top:10px}
.shopcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.shopcard p{margin:4px 0 6px;font-size:.85rem;color:var(--muted)}
.shopcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lines{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem;margin-bottom:10px}
.neg{color:var(--spend)}
.split{display:flex;height:44px;border-radius:10px;overflow:hidden;background:var(--soft);margin:6px 0 8px}
.split span{transition:flex-basis .35s ease;flex:0 0 0;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.slider{margin-bottom:12px}
.slider label{display:flex;justify-content:space-between;font-size:.92rem}
.slider input{width:100%}
.hint{font-size:.88rem;background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.flash{font-weight:700;background:var(--save);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px}

/* Event */
.event h2{font-size:1.25rem;margin-top:6px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.lesson{border-left:4px solid var(--gold);padding:8px 12px;margin:14px 0;background:var(--paper);border-radius:0 10px 10px 0}
.news{font-size:.88rem;color:var(--muted);margin-bottom:12px}
.storm{font-weight:700;background:var(--spend);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.counter{font-size:.82rem;font-weight:700;color:var(--spend);margin-bottom:6px}
.squeeze{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.impact>span{display:flex;flex-direction:column;background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.92rem}
.choice .impact>span{background:var(--card)}
.why{font-size:.85rem;color:var(--muted);padding-left:1.2em;margin:8px 0 0}
.why li{margin-bottom:3px}
.toggle{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:.9rem}
.toggle[aria-pressed="true"]{border-color:var(--save);background:color-mix(in srgb,var(--save) 15%,var(--paper))}
svg.chart{width:100%;height:auto;display:block}
.log{margin:0;padding:0;list-style:none;font-size:.88rem}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.score{font-size:3rem;font-weight:800;line-height:1}
.endlist{padding-left:1.2em;margin:.4em 0}
.endlist li{margin-bottom:.4em}
footer{font-size:.78rem;color:var(--muted);text-align:center;margin-top:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const M=1e6, KEY="htc-save-v2";
/* ---------- Thu thập dữ liệu chơi ẩn danh (chỉ khi người chơi đồng ý) ---------- */
const TRACK_URL="/api/track";
function uid(){try{return crypto.randomUUID()}catch(e){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}}
const PID=(()=>{try{let p=localStorage.getItem("htc-pid");if(!p){p=uid();localStorage.setItem("htc-pid",p)}return p}catch(e){return uid()}})();
let consent=(()=>{try{return localStorage.getItem("htc-consent")==="1"}catch(e){return false}})();
const trackOn=()=>consent&&location.protocol.startsWith("http")&&!/claude\./.test(location.hostname);
let tq=[];
function track(type,d){if(!trackOn())return;tq.push({type,t:Date.now(),d});if(tq.length>=8)flush()}
function flush(beacon){if(!tq.length||!trackOn())return;
  const body=JSON.stringify({pid:PID,gid:(s&&s.gid)||null,v:1,events:tq.splice(0,50)});
  try{if(beacon&&navigator.sendBeacon)navigator.sendBeacon(TRACK_URL,body);
    else fetch(TRACK_URL,{method:"POST",headers:{"content-type":"application/json"},body,keepalive:true}).catch(()=>{})}catch(e){}}
setInterval(()=>flush(),20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush(true)});
function snapshot(){return {q:s.q,nw:Math.round(nw()),tier:tierOf(),happy:Math.round(s.happy),will:Math.round(s.will??55),knowledge:s.knowledge,
  liquid:Math.round(liquid()),debt:Math.round(debtTotal()),hiDebt:Math.round(hiDebt()),salary:Math.round(s.job.employed?s.job.salary:0),
  employed:s.job.employed,part:!!s.job.part,life:s.life,alloc:s.alloc,autoSave:!!s.autoSave,
  sources:s.sources.map(x=>x.id+(x.managed?"*":"")),study:s.study?s.study.id:null,freeTime:freeTime(),usedTime:usedTime()}}

const DIFF={
  de:{label:"Dễ",years:5,inflation:.025,rate:.05,gold:[.06,.10],stock:[.09,.20],big:.14,leak:.04,stack:[.25,.08],storm:.05,raise:[.02,.06],desc:"5 năm, lạm phát 2,5%/năm, biến cố lớn ít gặp"},
  thuong:{label:"Thường",years:8,inflation:.04,rate:.045,gold:[.05,.14],stock:[.08,.28],big:.22,leak:.06,stack:[.35,.1],storm:.08,raise:[0,.05],desc:"8 năm, lạm phát 4%/năm, biến cố lớn khá thường gặp"},
  kho:{label:"Khó",years:10,inflation:.05,rate:.04,gold:[.04,.18],stock:[.07,.34],big:.3,leak:.08,stack:[.45,.15],storm:.12,raise:[0,.05],desc:"10 năm, lạm phát 5%/năm, biến cố dồn dập, lương tăng chậm hơn giá cả"}
};
const LIFE={tk:{label:"Tằn tiện",mult:.8,happy:-5},vp:{label:"Vừa phải",mult:1,happy:0},tt:{label:"Thoải mái",mult:1.3,happy:5}};
const DEBT={
  card:{name:"Nợ thẻ tín dụng",rate:.30,n:0},
  consumer:{name:"Vay tiêu dùng qua app",rate:.38,n:36},
  installment:{name:"Trả góp",rate:.20,n:18},
  bank:{name:"Vay ngân hàng",rate:.11,n:60},
  mortgage:{name:"Vay mua nhà",rate:.095,n:240},
  family:{name:"Nợ người thân",rate:0,n:36},
  hot:{name:"Vay nóng",rate:1.2,n:12},
  student:{name:"Vay vốn học tập",rate:.066,n:60}
};
const PERSONAS={
  hs:{label:"Sinh viên vừa học vừa làm",job:"Phục vụ quán cà phê",salary:4,vol:.1,cost:4.5,cash:2,home:0,part:true,study:"daihoc",support:2.5,debts:{student:10},desc:"Năm 2 đại học, việc học chiếm khoảng 65% thời gian, làm thêm 4 triệu, gia đình hỗ trợ 2,5 triệu mỗi tháng"},
  cn:{label:"Công nhân khu công nghiệp",job:"Công nhân",salary:5.5,vol:.05,cost:5,cash:1.5,home:0,debts:{consumer:25},desc:"Lương cơ bản 5,5 triệu, tăng ca thêm khoảng 2 triệu, nợ app vay tiêu dùng 25 triệu, gần như không có tiền dư"},
  sv:{label:"Sinh viên mới ra trường",job:"Nhân viên mới",salary:7.5,vol:.03,cost:6.5,cash:2,home:0,debts:{card:15},desc:"Lương 7,5 triệu, nợ thẻ tín dụng 15 triệu, tài khoản còn 2 triệu"},
  tt:{label:"Tiểu thương bán hàng ở chợ",job:"Sạp hàng ở chợ",salary:10,vol:.4,cost:8,cash:8,home:0,debts:{family:50,consumer:10},desc:"Thu nhập khoảng 10 triệu nhưng thất thường, nợ người thân 50 triệu và vay app 10 triệu"},
  vp:{label:"Nhân viên văn phòng",job:"Nhân viên văn phòng",salary:13,vol:.03,cost:10,cash:20,home:0,debts:{installment:25},desc:"Lương 13 triệu, có 20 triệu, đang trả góp xe 25 triệu"},
  ql:{label:"Quản lý cấp trung",job:"Quản lý",salary:32,vol:.03,cost:18,cash:80,home:2000,debts:{mortgage:1300},desc:"Lương 32 triệu, nhà 2 tỷ nhưng vay 1,3 tỷ, trả góp hơn 12 triệu mỗi tháng"},
  me:{label:"Tình trạng của tôi",custom:true,desc:"Tự nhập thu nhập, chi tiêu và các khoản nợ thật của bạn"}
};
const CUSTOM_FIELDS=[["salary","Thu nhập mỗi tháng"],["cost","Chi phí sinh hoạt mỗi tháng"],["cash","Tiền mặt và tiết kiệm hiện có"],["home","Giá trị nhà, đất đang sở hữu"],["card","Nợ thẻ tín dụng"],["consumer","Vay tiêu dùng, vay qua app"],["bank","Vay ngân hàng (kinh doanh, xe)"],["mortgage","Vay mua nhà"],["family","Nợ người thân"],["student","Vay vốn học tập"],["support","Gia đình hỗ trợ bạn mỗi tháng"],["send","Bạn gửi về gia đình mỗi tháng"]];
const SOURCES={
  tangca:{kind:"side",name:"Tăng ca ở chỗ làm",capital:0,overtime:true,vol:.1,time:10,start:1,cap:1,risk:"Thấp",need:()=>s.job.employed&&!s.job.part,needTxt:"Chỉ khi đang làm toàn thời gian",desc:"Lương giờ nhân 1,5. Chắc chắn nhưng phụ thuộc lương chính, công ty không phải lúc nào cũng có ca."},
  phucvu:{kind:"side",name:"Phục vụ, bán hàng part-time",capital:0,base:1.6,vol:.1,time:15,start:1,cap:1.1,risk:"Thấp",desc:"Khoảng 25 nghìn mỗi giờ. Dễ xin việc nhưng thu nhập thấp."},
  xe:{kind:"side",name:"Chạy xe công nghệ, giao hàng",capital:0,base:2.9,fixed:.8,vol:.3,time:15,start:1,cap:1.05,risk:"Thấp",desc:"Khoảng 45 nghìn mỗi giờ trước khi trừ xăng và hao mòn xe. Nắng mưa, rất mệt."},
  giasu:{kind:"side",name:"Dạy kèm, gia sư",capital:0,base:3,vol:.35,time:10,start:.4,cap:1.3,risk:"Thấp",desc:"Khoảng 60–80 nghìn mỗi giờ khi đủ học trò, nhưng lúc đầu khó tìm."},
  online:{kind:"side",name:"Bán hàng online",capital:15,base:4,fixed:1.2,vol:.8,time:15,start:.15,cap:2,fail:.08,canLose:true,risk:"Cao",desc:"Đa số người bán nhỏ lãi dưới 3 triệu mỗi tháng, nhiều người lỗ tiền quảng cáo rồi bỏ cuộc."},
  free:{kind:"side",name:"Freelance (thiết kế, viết, lập trình)",capital:8,base:4,fixed:.3,vol:.6,time:15,start:.2,cap:2,fail:.03,risk:"Vừa",need:()=>!!s.skilled,needTxt:"Cần bằng cấp hoặc chứng chỉ chuyên môn",desc:"Khách khó tìm lúc đầu. Có tay nghề và uy tín thì thu nhập theo giờ cao."},
  cafe:{kind:"biz",name:"Xe cà phê mang đi",capital:50,base:10,fixed:3,vol:.6,time:28,start:.2,cap:1.4,fail:.07,canLose:true,risk:"Cao",desc:"Vốn nhỏ nhưng tốn nhiều giờ đứng bán, dễ lỗ khi vắng khách."},
  taphoa:{kind:"biz",name:"Cửa hàng tạp hóa",capital:300,base:25,fixed:8,vol:.35,time:30,start:.4,cap:1.3,fail:.03,canLose:true,risk:"Vừa",desc:"Ổn định hơn, nhưng cần vốn hàng hóa lớn và lãi mỏng."},
  quan:{kind:"biz",name:"Quán ăn",capital:200,base:30,fixed:12,vol:.5,time:30,start:.2,cap:1.6,fail:.09,canLose:true,risk:"Rất cao",desc:"Mấy quý đầu thường lỗ tiền mặt bằng, nhân công. Lời lớn nếu trụ được."},
  tro:{kind:"biz",name:"Xây phòng trọ cho thuê",capital:800,base:7,fixed:1,vol:.15,time:3,start:.8,cap:1.2,fail:0,risk:"Thấp",passive:true,desc:"Vốn rất lớn, lợi nhuận khoảng 8–10%/năm, gần như thụ động."}
};
/* ---------- Nghề nghiệp và mức làm thêm ---------- */
const CAREERS={
  phucvu:{name:"Làm thêm bán thời gian",levels:[["Phục vụ, bán hàng part-time",4]],minQ:99},
  congnhan:{name:"Sản xuất",levels:[["Công nhân",6.5],["Thợ lành nghề",8],["Tổ trưởng",10.5],["Quản đốc",15]],minQ:8},
  vanphong:{name:"Văn phòng",levels:[["Nhân viên mới",7.5],["Nhân viên",10],["Chuyên viên",14],["Trưởng nhóm",20],["Trưởng phòng",30]],minQ:6,needDegree:3},
  tieuthuong:{name:"Buôn bán",levels:[["Sạp hàng nhỏ",10],["Sạp đông khách",14],["Hai sạp hàng",20]],minQ:8},
  quanly:{name:"Quản lý",levels:[["Quản lý",32],["Giám đốc bộ phận",45],["Giám đốc",65]],minQ:10},

function stress(){const m=liquid()/living();return (m<1?.15:m<3?.05:0)+(hiDebt()>0?.05:0)+(s.happy<35?.1:0)}
function execBase(share){return clamp((s.will??55)/100+.25-Math.max(0,share-.25)*1.2-stress(),.2,1)}
function snapMetrics(){return {assets:s.cash+s.savings+goldVal()+stockVal()+s.home+s.land+bizTotal(),debts:Object.fromEntries(Object.entries(s.debts).map(([k,d])=>[k,d.bal])),sal:s.job.employed?s.job.salary:0,cost:s.baseCost,happy:s.happy,noSal:s.noSalary||0,pend:(s.pending||[]).length}}
function debtCost(type,amt){const d=DEBT[type];if(!d.n)return amt*Math.pow(1+d.rate,2);return calcPay(type,amt)*d.n}
function impactOf(a,b){
  const why=[];let dDebt=0,longDebt=0;
  new Set([...Object.keys(a.debts),...Object.keys(b.debts)]).forEach(k=>{const dd=(b.debts[k]||0)-(a.debts[k]||0);if(Math.abs(dd)<1000)return;
    const c=debtCost(k,Math.abs(dd))*Math.sign(dd);dDebt+=dd;longDebt+=c;
    if(dd>0)why.push(`Khoản ${DEBT[k].name.toLowerCase()} mới ${fmt(dd)} sẽ tốn tổng cộng khoảng ${fmt(c)} tính cả lãi.`);
    else why.push(`Trả bớt ${fmt(-dd)} ${DEBT[k].name.toLowerCase()} giúp tránh khoảng ${fmt(-c+dd)} tiền lãi.`)});
  const lost=(b.noSal-a.noSal)*3*a.sal,dA=b.assets-a.assets-lost,g=Math.pow(1.08,5);
  const short=dA-dDebt;let long=dA*g-longDebt;
  if(Math.abs(dA)>=5e5)why.push(dA<0?`Số tiền ${fmt(-dA)} nếu để đầu tư 8%/năm, sau 5 năm sẽ thành ${fmt(-dA*g)}.`:`Khoản ${fmt(dA)} này nếu tiếp tục sinh lời 8%/năm, sau 5 năm thành ${fmt(dA*g)}.`);
  if(lost>0)why.push(`Mất một quý lương, khoảng ${fmt(lost)}.`);
  const dS=b.sal-a.sal;if(Math.abs(dS)>1000){long+=dS*60;why.push(`Lương ${dS>0?"tăng":"giảm"} ${fmt(Math.abs(dS))}/tháng, cộng dồn 5 năm là ${fmt(Math.abs(dS)*60)}.`)}
  const dC=(b.cost-a.cost)*LIFE[s.life].mult*s.priceIdx;if(Math.abs(dC)>1000){long-=dC*60;why.push(`Chi phí sinh hoạt ${dC>0?"tăng":"giảm"} ${fmt(Math.abs(dC))}/tháng, cộng dồn 5 năm là ${fmt(Math.abs(dC)*60)}.`)}
  if(b.pend>a.pend)why.push("Chưa tính khoản tiền có thể được trả lại sau này.");
  return {short,long,happy:b.happy-a.happy,why};
}
function previewImpact(e,i){const snap=JSON.stringify(s),a=snapMetrics();e.choices[i].run();tidy();const r=impactOf(a,snapMetrics());s=JSON.parse(snap);return r}
const canPreview=()=>s.diff==="de"||s.knowledge>=5;
function impactHTML(m){const col=v=>v>=0?"var(--save)":"var(--spend)",sg=v=>(v>=0?"+":"")+fmt(v);
  return `<span class="impact"><span><span class="muted small">Ngắn hạn</span><b style="color:${col(m.short)}">${sg(m.short)}</b>${Math.round(m.happy)?`<span class="small muted">Hạnh phúc ${m.happy>0?"+":""}${Math.round(m.happy)}</span>`:""}</span>
   <span><span class="muted small">Dài hạn (5 năm)</span><b style="color:${col(m.long)}">${sg(m.long)}</b></span></span>`}
function decisionReview(){const d=(s.decisions||[]).filter(x=>Math.abs(x.long)>=1e6);if(!d.length)return "";
  const worst=[...d].sort((a,b)=>a.long-b.long).slice(0,3).filter(x=>x.long<0),best=[...d].sort((a,b)=>b.long-a.long).slice(0,3).filter(x=>x.long>0);
  const total=d.filter(x=>x.long<0).reduce((t,x)=>t+x.long,0);
  const li=x=>`<li><b>${x.title}</b> (năm ${Math.floor(x.q/4)+1}): ${x.label}. Ngắn hạn ${(x.short>=0?"+":"")+fmt(x.short)}, dài hạn ${(x.long>=0?"+":"")+fmt(x.long)}.</li>`;
  return `<h3>Nhìn lại các quyết định</h3><p class="small muted" style="margin-top:0">Cộng dồn, các lựa chọn tốn kém đã lấy đi của bạn khoảng ${fmt(-total)} về dài hạn. Người nghèo thường khổ không vì một quyết định lớn, mà vì nhiều quyết định nhỏ có cái giá dài hạn không nhìn thấy.</p>
   ${worst.length?`<div class="small" style="font-weight:700;margin-top:8px">Tốn kém nhất</div><ul class="endlist">${worst.map(li).join("")}</ul>`:""}
   ${best.length?`<div class="small" style="font-weight:700;margin-top:8px">Đáng giá nhất</div><ul class="endlist">${best.map(li).join("")}</ul>`:""}`}
function priorityTip(h){
  if(s.happy<30)return "Bạn đang kiệt sức nên thu nhập bị giảm. Bớt việc làm thêm hoặc nới lối sống một chút trước khi cố tiếp.";
  if(s.badDebt>0)return "Bạn đang có nợ xấu. Ưu tiên tuyệt đối: trả nợ tối thiểu đúng hạn, không vay thêm, cắt chi tiêu không thiết yếu.";
  if(liquid()<living()&&h.hi>0)return "Bạn đang trong “bẫy nghèo”: không có tiền đệm, nợ lãi cao, mọi thứ đắt hơn và ý chí bị bào mòn. Mục tiêu duy nhất lúc này: gom đủ 1 tháng chi phí và không vay thêm.";
  if(h.hi>0)return "Trả nợ lãi cao trước. Trả một khoản lãi 30% giống như có khoản đầu tư lời chắc 30%.";
  if(h.efund<1)return "Gom ngay 1 tháng chi phí làm quỹ dự phòng để không phải quẹt thẻ khi có biến cố.";
  if(h.saveRate<.1)return "Tăng tỷ lệ để dành: chọn lối sống tằn tiện một thời gian hoặc thêm nghề tay trái.";
  if(h.dti>.36)return "Không vay thêm. Dồn tiền dư để giảm gánh nợ hằng tháng.";
  if(h.efund<3)return "Gửi tiết kiệm cho đủ quỹ dự phòng 3 tháng chi phí.";
  if(h.nsrc<2)return "Thêm một nguồn thu nhỏ, ít vốn để bớt phụ thuộc lương.";
  if(h.efund<6)return "Hoàn thiện quỹ dự phòng 6 tháng, sau đó tăng tỷ lệ đầu tư.";
  if(h.pr<.5)return "Đưa phần lớn tiền dư vào quỹ ETF hoặc kinh doanh có người quản lý để xây thu nhập thụ động.";
  return "Giữ kỷ luật, đa dạng hóa và đừng để lối sống tăng nhanh hơn thu nhập.";
}

 {id:"baohiem",size:"vua",title:"Tư vấn bảo hiểm sức khỏe",when:()=>!s.insured,text:()=>`Gói bảo hiểm sức khỏe ${fmt(4*M*pi())}/năm, chi trả thêm 50% chi phí nằm viện và tai nạn.`,

 {id:"bome",size:"vua",title:"Bố mẹ cần sửa nhà",text:()=>`Bố mẹ ở quê cần sửa mái nhà trước mùa mưa, còn thiếu khoảng ${fmt(8*M*pi())}.`,

 {id:"thuong",size:"vua",title:"Thưởng hoàn thành dự án",when:()=>s.job.employed,text:()=>`Dự án thành công, bạn được thưởng ${fmt(5*M*pi())}.`,

 {id:"catgiam",size:"vua",title:"Công ty cắt giảm nhân sự",when:()=>s.job.employed&&s.q>=2,text:()=>"Bạn nằm trong danh sách bị cắt giảm cuối quý.",

 {id:"crash",size:"vua",title:"Chứng khoán lao dốc",pre:()=>{s.stockPrice*=.72;s.rebound=3},text:()=>"Tin xấu từ kinh tế thế giới khiến thị trường giảm gần 30%. Mạng xã hội tràn ngập hoảng sợ.",

 {id:"vang",size:"vua",title:"Cơn sốt giá vàng",pre:()=>{s.goldPrice*=1.15;s.goldCool=2},text:()=>"Giá vàng tăng 15% trong vài tuần, người dân xếp hàng dài trước tiệm vàng.",

 {id:"doithu",size:"vua",title:"Đối thủ mở ngay bên cạnh",when:()=>bizList().length>0,pre:()=>{s.evTarget=rnd(bizList()).uid},

 {id:"viral",size:"vua",title:"Lên xu hướng mạng xã hội",when:()=>s.sources.some(x=>x.id==="online"||x.id==="free"),pre:()=>{s.evTarget=rnd(s.sources.filter(x=>x.id==="online"||x.id==="free")).uid},

 {id:"thuenha",size:"vua",title:"Chủ nhà tăng tiền thuê",when:()=>!s.home,text:()=>"Chủ nhà báo tăng tiền thuê 15% từ tháng sau. Chuyển đi thì mất tiền cọc và công dọn.",

 {id:"nguoinha",size:"vua",title:"Người nhà ốm nặng",text:()=>`Bố bạn phải mổ gấp, gia đình cần góp khoảng ${fmt(20*M*pi())}.`,

 {id:"bomehuu",size:"vua",title:"Bố mẹ nghỉ hưu",when:()=>!s.study&&(s.famBase||0)<3*M,text:()=>`Bố mẹ nghỉ làm, thu nhập giảm, mong bạn gửi thêm ${fmt(1*M*pi())} mỗi tháng.`,

 {id:"thungdo",size:"nho",title:"Thùng đồ từ quê",when:()=>(s.support||0)>0||(s.famSend||0)>0,text:()=>"Mẹ gửi lên thùng đồ ăn, gạo, nước mắm và kẹp thêm ít tiền.",

 {id:"tainan",size:"lon",title:"Tai nạn giao thông nghiêm trọng",text:()=>`Bạn phải phẫu thuật và nghỉ dưỡng 3 tháng. Chi phí khoảng ${fmt(80*M*pi()*(s.insured?.4:1))}${s.insured?" sau khi bảo hiểm chi trả":""}.`,

const TET={id:"tet",size:"tet",title:"Tết đến",pre:()=>{s.tetB=s.job.employed?s.job.salary*(.3+Math.random()*.9):Math.max(2*M,s.sources.reduce((t,x)=>t+Math.max(0,expected(x)),0)*.5)},

function newGame(){
  const P=cfg.persona==="me"?{job:"Công việc hiện tại",vol:.05,...cfg.custom,debts:Object.fromEntries(["card","consumer","bank","mortgage","family","student"].map(k=>[k,cfg.custom[k]]))}:PERSONAS[cfg.persona];
  const X=cfg.persona==="me"?{career:"tudo",lvl:0,send:cfg.custom.send||0}:PEXTRA[cfg.persona];
  s={diff:cfg.diff,persona:cfg.persona,q:0,totalQ:DIFF[cfg.diff].years*4,
    job:{name:P.job,salary:Math.max(0,P.salary)*M,vol:P.vol,employed:P.salary>0,part:!!P.part,extraTime:0,last:Math.max(0,P.salary)*M,career:X.career,lvl:X.lvl,lvlQ:0},
    study:P.study?{id:P.study,progress:0,loan:false}:null,support:(P.support||0)*M,famBase:(X.send||0)*M,famSend:(X.send||0)*M,skilled:["vp","ql"].includes(cfg.persona),
    baseCost:Math.max(1,P.cost)*M,priceIdx:1,life:"vp",cash:Math.max(0,P.cash)*M,savings:0,goldUnits:0,goldPrice:7.5*M,stockUnits:0,stockPrice:20000,
    home:Math.max(0,P.home||0)*M,land:0,landHot:0,debts:{},sources:[],happy:60,will:55,autoSave:false,decisions:[],knowledge:0,alloc:{debt:0,sav:40,gold:10,stock:20},
    phase:"plan",eventId:null,result:null,history:[],log:[],lessons:[],used:[],news:"",pending:[],noSalary:0,insured:false,
    rebound:0,goldCool:0,recession:0,evTarget:null,planNote:"",flash:"",stats:{interest:0,bizProfit:0}};
  for(const k in P.debts)if(P.debts[k]>0)addDebt(k,P.debts[k]*M);
  (X.startSrc||[]).forEach((id,i)=>s.sources.push({uid:"start-"+i,id,level:SOURCES[id].start,age:4,managed:false,last:null,lossStreak:0,tier:1}));
  if(hiDebt()>0)s.alloc={debt:50,sav:30,gold:0,stock:0};
  s.gid=uid();s.startTier=s.bestTier=tierOf();s.history.push(nw());
  track("game_start",{persona:cfg.persona,diff:cfg.diff,custom:cfg.persona==="me"?cfg.custom:null,startTier:s.startTier,screen:window.innerWidth});
  log(`Bắt đầu ở bậc “${RUNGS[s.startTier]}”.`);save();render();
}
function planNumbers(){
  const job=s.job.employed&&!(s.noSalary>0)?s.job.salary*3:0;
  const side=s.sources.reduce((t,x)=>t+expected(x)*3,0);
  const sup=((s.support||0)-(s.famSend||0))*3,tui=s.study&&!s.study.loan?studyTuition():0;
  const income=job+side+sup,cost=living()*3+tui,minPay=Object.values(s.debts).reduce((t,d)=>t+Math.min(d.pay*3,d.bal),0);
  let pool=income-cost-minPay,shortfall=0;if(pool<0){shortfall=-pool;pool=0}
  const a=s.alloc,ex=Math.min(debtTotal()-minPay,pool*a.debt/100),rest=pool-ex;
  const sav=pool*a.sav/100,gold=pool*a.gold/100,stock=pool*a.stock/100;
  return {sup,tui,job,side,income,cost,minPay,shortfall,extra:Math.max(0,ex),sav,gold,stock,cash:Math.max(0,rest-sav-gold-stock)};
}
function confirmPlan(){
  track("quarter_plan",snapshot());
  const notes=[],d=DIFF[s.diff];s.flash="";
  s.pending=s.pending.filter(p=>{if(p.q>s.q)return true;
    if(p.amt<0)notes.push(`${p.note}: phải nộp ${fmt(-p.amt)}.`+pay(-p.amt));
    else if(p.ok){s.cash+=p.amt;notes.push(`${p.note}: thu về ${fmt(p.amt)}.`)}else notes.push(`${p.note}: mất trắng.`);return false});
  let job=0;
  if(s.job.employed){if(s.noSalary>0){s.noSalary--;notes.push("Quý này không có lương.")}
    else job=s.job.salary*3*Math.max(.3,1+s.job.vol*randn())*(s.recession>0?.85:1)*(s.happy<30?.85:1)}
  let side=0;
  const tired=s.happy<30;if(tired)notes.push("Bạn đang kiệt sức, làm việc kém hiệu quả: thu nhập giảm 15%.");
  s.sources.forEach(x=>{const t=T(x);let m=gross(x)*(1+t.vol*randn())*(tired?.85:1)-(t.fixed||0)*M*pi()*tierMult(x);if(!t.canLose)m=Math.max(0,m);
    x.last=m;side+=m*3;s.stats.bizProfit+=m*3;x.lossStreak=m<0?x.lossStreak+1:0;x.age++;x.level=Math.min(t.cap,x.level+.12*(.3+Math.random()))});
  s.sources=s.sources.filter(x=>{const t=T(x);if(t.fail&&Math.random()<t.fail*(1+x.lossStreak)){const v=t.capital*M*pi()*.2;s.cash+=v;
    notes.push(`“${t.name}” thua lỗ kéo dài phải đóng cửa, thanh lý được ${fmt(v)}.`);addLesson("Phần lớn cơ sở kinh doanh nhỏ thất bại trong vài năm đầu. Đừng dồn toàn bộ tài sản vào một cửa hàng.");return false}return true});
  const leak=living()*3*DIFF[s.diff].leak*(.5+Math.random());notes.push(`Chi phí lặt vặt phát sinh ngoài dự tính: ${fmt(leak)}.`);
  if(s.happy<15&&Math.random()<.4)notes.push("Kiệt sức phải đi khám và nghỉ ngơi."+pay(5*M*pi()));
  const poor=liquid()<living();if(poor)notes.push("Không có tiền đệm nên phải mua lẻ, mua chịu: mọi thứ đắt hơn khoảng 6%.");
  const cost=living()*3*(poor?1.06:1)+leak;let debtOut=0;
  const avail=Math.max(0,job+side+((s.support||0)-(s.famSend||0))*3-cost-(s.study&&!s.study.loan?studyTuition():0));let due=0;
  for(const k in s.debts){const dd=s.debts[k],i=dd.bal*DEBT[k].rate/4;s.stats.interest+=i;dd.bal+=i;due+=Math.min(dd.bal,dd.pay*3)}
  const ratio=due>avail?avail/due:1;
  for(const k in s.debts){const dd=s.debts[k],need=Math.min(dd.bal,dd.pay*3),p=need*ratio;dd.bal-=p;debtOut+=p;dd.bal+=(need-p)*.04;if(DEBT[k].n===0)dd.pay=calcPay(k,dd.bal)}
  if(ratio<.999){s.badDebt=4;s.happy-=4;notes.push(`Không đủ tiền trả nợ tối thiểu (chỉ trả được ${pc(ratio)}). Bạn bị xếp vào nhóm nợ xấu: chịu phí phạt, bị nhắc nợ liên tục và không vay được ngân hàng trong 1 năm.`);addLesson("Khi không trả nổi nợ, đừng vay chỗ này đắp chỗ kia. Hãy chủ động xin chủ nợ giãn nợ và cắt mọi chi tiêu không thiết yếu.")}
  else if(s.badDebt>0)s.badDebt--;
  const sup=((s.support||0)-(s.famSend||0))*3,tui=studyTuition();
  if((s.famSend||0)<(s.famBase||0)){s.happy-=((s.famBase-s.famSend)/M)*1.5;notes.push("Gửi về nhà ít hơn mong đợi, bố mẹ buồn lòng.")}else if((s.famSend||0)>(s.famBase||0))s.happy+=Math.min(4,(s.famSend-s.famBase)/M);
  if(s.study&&s.study.loan){addDebt("student",tui);notes.push(`Vay thêm ${fmt(tui)} để đóng học phí.`)}
  let pool=job+side+sup-cost-debtOut-(s.study&&!s.study.loan?tui:0);
  if(s.will==null)s.will=55;
  if(pool<0){const fee=-pool*.03;notes.push(`Thu không đủ chi, phải trả chậm và chịu phí ${fmt(fee)}.`+pay(-pool+fee))}
  else{const a=s.alloc,income=Math.max(1,job+side);
    const plan={debt:pool*a.debt/100,sav:pool*a.sav/100,gold:pool*a.gold/100,stock:pool*a.stock/100};
    const planned=plan.debt+plan.sav+plan.gold+plan.stock;
    const f=clamp(execBase(planned/income)+.1*randn(),.2,1);
    const prot=s.autoSave?plan.debt+plan.sav:0,free=planned-prot,impulse=free*(1-f),ku=free>0?1-impulse/free:1;
    if(!s.autoSave){plan.debt*=ku;plan.sav*=ku}plan.gold*=ku;plan.stock*=ku;
    const ex=payExtra(plan.debt);if(ex>0)notes.push(`Trả thêm ${fmt(ex)} vào khoản nợ lãi cao nhất.`);
    s.savings+=plan.sav;s.goldUnits+=plan.gold/s.goldPrice;s.stockUnits+=plan.stock/s.stockPrice;
    s.cash+=pool-impulse-ex-plan.sav-plan.gold-plan.stock;
    if(planned>0){const done=(planned-impulse)/planned;
      if(impulse>2e5){notes.push(`Kế hoạch chỉ làm được ${pc(done)}: ${fmt(impulse)} đã “bốc hơi” vào những món mua bốc đồng.`);s.happy+=2;s.will-=3}
      else{notes.push("Bạn giữ đúng kế hoạch quý này. Thói quen tốt đang hình thành.");s.will+=4}}
  }
  if(s.life==="tk")s.will-=2;if(s.happy<30)s.will-=3;if(stress()>=.15)s.will-=2;s.will=clamp(s.will,10,100);
  const over=Math.max(0,usedTime()+s.job.extraTime-10);
  s.happy+=LIFE[s.life].happy-over/6;
  studyTick(notes);
  if(usedTime()>freeTime())notes.push("Bạn đang làm quá sức, hạnh phúc giảm nhanh.");
  s.savings*=1+d.rate/4;
  let gr=d.gold[0]/4+d.gold[1]/2*randn();if(s.goldCool>0){gr-=.07;s.goldCool--}
  let sr=d.stock[0]/4+d.stock[1]/2*randn();if(s.rebound>0){sr+=.09;s.rebound--}
  gr=Math.max(gr,-.4);sr=Math.max(sr,-.45);s.goldPrice*=1+gr;s.stockPrice*=1+sr;
  s.home*=1+.01+.02*randn();

/* Biến cố xấu có thể ập đến cùng lúc */
const HAZ=["phat","manhinh","dien","luaonline","om","xe","vay","lua","sale","bome","catgiam","crash","doithu","nhanvien","thuenha","nguoinha","trom","tainan","suythoai","chay","thi","catchucap","bomehuu"];
/* Kéo theo ngay trong quý */
const CHAIN={suythoai:[["catgiam",.5],["doithu",.35]],chay:[["nhanvien",.5]],nguoinha:[["bome",.3]],tainan:[["xe",.6]],catgiam:[["vay",.25]]};
/* Để lại hậu quả quý sau */
const FOLLOW={tainan:[["catgiam",.4]],suythoai:[["crash",.4],["nhanvien",.3]],catgiam:[["the",.5]],om:[["catgiam",.15]],crash:[["suythoai",.15]],nguoinha:[["om",.2],["bomehuu",.3]]};
function pickEvent(hazard){
  const q=s.queue||[];
  const ok=e=>(!e.when||e.when())&&!q.includes(e.id)&&!((s.cool||{})[e.id]>s.q);
  if(!hazard&&s.q%4===0&&!q.includes("tet"))return "tet";
  let size;
  if(hazard)size=Math.random()<.35?"lon":"vua";
  else{const r=Math.random(),big=DIFF[s.diff].big;size=r<.15?"quiz":r<.15+big?"lon":r<.55?"nho":"vua"}
  const match=e=>(size==="quiz"?e.quiz:e.size===size)&&(!hazard||HAZ.includes(e.id));
  let pool=EVENTS.filter(e=>match(e)&&ok(e)&&!s.used.includes(e.id));
  if(!pool.length){s.used=s.used.filter(id=>!EV[id]||!match(EV[id]));pool=EVENTS.filter(e=>match(e)&&ok(e))}
  if(!pool.length)pool=EVENTS.filter(e=>ok(e)&&!e.quiz&&(!hazard||HAZ.includes(e.id)));
  if(!pool.length)return null;
  const e=rnd(pool);s.used.push(e.id);(s.cool=s.cool||{})[e.id]=s.q+({lon:20,vua:4,nho:2}[e.size]||3);return e.id;
}
function buildQueue(){
  s.queue=[];s.storm=false;const d=DIFF[s.diff];
  const add=id=>{if(id&&!s.queue.includes(id)&&s.queue.length<4)s.queue.push(id)};
  s.linked=[];
  (s.forced||[]).forEach(id=>{const e=EV[id];if(e&&(!e.when||e.when())){add(id);s.linked.push(id)}});s.forced=[];
  add(pickEvent(false));
  if(Math.random()<d.storm){s.storm=true;for(let i=0;i<3;i++)add(pickEvent(true))}
  else{if(Math.random()<d.stack[0])add(pickEvent(true));if(Math.random()<d.stack[1])add(pickEvent(true))}
  s.qTotal=s.queue.length;s.qIdx=0;
}
function startNextEvent(){
  while(s.queue&&s.queue.length){const id=s.queue.shift(),e=EV[id];
    if(!e||(e.when&&!e.when())){s.qTotal--;continue}
    s.qIdx++;s.eventId=id;if(e.pre)e.pre();s.phase="event";return true}
  return false;
}
function choose(i){
  const e=EV[s.eventId];let out,label,lesson;
  if(e.quiz){const ok=i===e.correct;if(ok){s.knowledge++;s.happy+=2}
    out=ok?"Chính xác! +1 điểm kiến thức.":`Chưa đúng. Đáp án: ${e.options[e.correct]}.`;label=e.options[i];lesson=e.lesson}
  let impact=null;
  if(!e.quiz){const c=e.choices[i],a=snapMetrics();out=c.run()||"";label=c.label;lesson=c.lesson;tidy();impact=impactOf(a,snapMetrics());
    (s.decisions=s.decisions||[]).push({q:s.q,title:e.title,label,short:impact.short,long:impact.long})}
  addLesson(lesson);tidy();
  s.queue=s.queue||[];s.linked=s.linked||[];s.qTotal=s.qTotal||1;
  const chained=[];
  (CHAIN[e.id]||[]).forEach(([id,p])=>{const f=EV[id];if(Math.random()<p&&(!f.when||f.when())&&!s.queue.includes(id)&&id!==e.id){s.queue.unshift(id);s.qTotal++;s.linked.push(id);chained.push(f.title)}});
  (FOLLOW[e.id]||[]).forEach(([id,p])=>{if(Math.random()<p&&!(s.forced||[]).includes(id))(s.forced=s.forced||[]).push(id)});
  if(chained.length)out+=` Họa vô đơn chí: chuyện này kéo theo “${chained.join("”, “")}”.`;
  s.result={title:e.title,size:e.quiz?"quiz":e.size,label,out,lesson,impact};
  track("decision",{q:s.q,id:e.id,size:e.quiz?"quiz":e.size,choice:i,label,correct:e.quiz?i===e.correct:null,short:impact?Math.round(impact.short):null,long:impact?Math.round(impact.long):null,chained:chained.length,storm:!!s.storm});
  log(`${e.title}: ${label}.`);s.phase="result";save();render();
}
function nextQuarter(){

  if(s.sibEnd&&s.q>=s.sibEnd){s.famBase=Math.max(0,(s.famBase||0)-s.sibAmt);s.famSend=Math.max(0,(s.famSend||0)-s.sibAmt);s.sibEnd=0;log("Em đã tốt nghiệp, bạn thôi phụ học phí.")}
  if(s.q%4===0&&s.support&&!s.study){s.support*=.5;if(s.support<.3*M)s.support=0;log(s.support?"Bố mẹ giảm một nửa tiền chu cấp.":"Bố mẹ thôi chu cấp, bạn hoàn toàn tự lập.")}
  if(s.q%4===0&&s.q<s.totalQ){
    const d=DIFF[s.diff];let t="Sang năm mới.";
    if(s.job.employed){const [lo,hi]=d.raise,r=lo+Math.random()*(hi-lo);s.job.salary*=1+r;
      t+=r>.001?` Lương tăng ${pct(r)}.`:r<-.001?` Công ty khó khăn, lương giảm ${pct(r).slice(1)}.`:" Năm nay không được tăng lương.";
      if(r>0&&s.life!=="tk"){s.baseCost*=1+r*.5;t+=" Chi tiêu cũng tăng theo thu nhập."}}
    s.priceIdx*=1+d.inflation;if(d.inflation)t+=` Giá cả tăng ${pct(d.inflation)}.`;
    if(s.insured){pay(4*M*pi());t+=" Đã đóng phí bảo hiểm năm."}
    log(t);
  }
  const t=tierOf();
  if(t>s.bestTier){s.bestTier=t;s.flash=`🎉 Bạn đã lên bậc “${RUNGS[t]}”!`;log(`Lên bậc “${RUNGS[t]}”.`)}
  s.result=null;s.phase=s.q>=s.totalQ?"end":"plan";
  if(s.phase==="end"){track("game_end",{...snapshot(),startTier:s.startTier,bestTier:s.bestTier,persona:s.persona,diff:s.diff,interest:Math.round(s.stats.interest),bizProfit:Math.round(s.stats.bizProfit)});flush()}tidy();save();render();window.scrollTo({top:0});
}

   <div class="small muted" style="margin-bottom:10px">Chia phần tiền dư sau chi tiêu và trả nợ tối thiểu. Phần còn lại giữ làm tiền mặt.</div>
   <button class="toggle" data-act="auto" aria-pressed="${!!s.autoSave}">${s.autoSave?"✓ ":""}Tự động trích tiền trả nợ và tiết kiệm ngay khi nhận lương</button>
   <div class="small muted" style="margin:4px 0 14px">Tiền đã trích tự động không bị “bốc hơi” vào chi tiêu bốc đồng.</div>
   ${hasDebt?sl("debt","Trả nợ thêm (khoản lãi cao nhất trước)","var(--debt)"):""}
   ${sl("sav","Gửi tiết kiệm (an toàn, lãi thấp)","var(--save)")}${sl("gold","Mua vàng (giữ giá, biến động vừa)","var(--gold)")}${sl("stock","Quỹ ETF, cổ phiếu (dài hạn, biến động mạnh)","var(--stock)")}
   <div id="shortHint"></div>
   <button class="primary" data-act="confirm">Chốt kế hoạch quý này</button></div>`;
}
function updatePreview(){
  const n=planNumbers(),lines=document.getElementById("lines");if(!lines)return;
  lines.innerHTML=`<span>Lương (3 tháng)</span><b>${fmt(n.job)}</b>
   ${n.sup?`<span>${n.sup>0?"Gia đình (hỗ trợ trừ phần gửi về)":"Gửi về gia đình"}</span><b class="${n.sup<0?"neg":""}">${fmt(n.sup)}</b>`:""}
   ${s.sources.length?`<span>Nghề tay trái, kinh doanh (dự kiến)</span><b>${fmt(n.side)}</b>`:""}
   <span>Chi phí sinh hoạt${n.tui?" và học phí":""}</span><b class="neg">${fmt(-n.cost)}</b>
   ${n.minPay>0?`<span>Trả nợ tối thiểu</span><b class="neg">${fmt(-n.minPay)}</b>`:""}
   <span class="muted">Chi phí phát sinh ngoài dự tính</span><b class="muted">chưa biết trước</b>
   <span>Còn dư để phân bổ</span><b>${fmt(n.income-n.cost-n.minPay)}</b>`;
  const tot=Math.max(n.income,n.cost+n.minPay,1),seg=[n.cost,n.minPay+n.extra,n.sav,n.gold,n.stock,n.cash];
  [...document.getElementById("split").children].forEach((el,i)=>el.style.flexBasis=Math.max(0,seg[i])/tot*100+"%");
  Object.keys(s.alloc).forEach(k=>{const e=document.getElementById("pv-"+k);if(e)e.textContent=s.alloc[k]+"%"});
  const share=(n.extra+n.sav+n.gold+n.stock)/Math.max(1,n.income),eb=execBase(share);
  document.getElementById("shortHint").innerHTML=(n.shortfall>0?`<div class="hint">Quý này thu không đủ chi, thiếu khoảng ${fmt(n.shortfall)}. Phần thiếu sẽ lấy từ tiền mặt, tiết kiệm, rồi bán tài sản; hết thì phải quẹt thẻ tín dụng.</div>`:"")
   +(share>0?`<div class="hint">Với kỷ luật và áp lực hiện tại, bạn có thể làm được khoảng <b>${pc(eb)}</b> kế hoạch để dành${s.autoSave?" (phần trích tự động luôn được giữ)":""}.${eb<.7?(share>.25?" Kế hoạch đang quá tham vọng, thử đặt mục tiêu vừa sức hơn.":" Áp lực tiền bạc đang bào mòn ý chí. Tự động trích tiền là cách chống “bốc hơi” hiệu quả."):""}</div>`:"");
}
function eventView(){
  const e=EV[s.eventId],sz=e.quiz?"quiz":e.size;
  const pv=!e.quiz&&canPreview();
  const opts=(e.quiz?e.options:e.choices.map(c=>c.label)).map((o,i)=>`<button class="choice" data-act="choose" data-v="${i}">${o}${pv?impactHTML(previewImpact(e,i)):""}</button>`).join("");
  const lockNote=!e.quiz&&!pv?`<p class="small muted" style="margin:12px 0 0">🔒 Ngoài đời, ta hiếm khi thấy trước hậu quả. Đạt 5 điểm kiến thức (hiện có ${s.knowledge}) để thấy ước tính tác động ngắn hạn và dài hạn của từng lựa chọn.</p>`:"";
  const first=(s.qIdx||1)===1,tot=s.qTotal||1;
  return `<div class="panel event">${first&&s.storm?`<div class="storm">⛈️ Họa vô đơn chí: quý này nhiều chuyện ập đến cùng lúc.</div>`:""}${first&&s.planNote?`<div class="hint">${s.planNote}</div>`:""}${first?`<div class="news">${s.news}</div>`:""}
   ${tot>1?`<div class="counter">Chuyện ${s.qIdx} trên ${tot} trong quý này</div>`:""}
   <span class="tag ${sz}">${SIZE[sz]}</span>${(s.linked||[]).includes(s.eventId)?` <span class="tag red">Hệ quả kéo theo</span>`:""}<h2>${e.title}</h2><p style="margin:0">${e.quiz?e.q:e.text()}</p>
   <div class="choices">${opts}</div>${lockNote}</div>`;
}
function resultView(){
  const r=s.result;
  return `<div class="panel event"><span class="tag ${r.size}">${SIZE[r.size]}</span><h2>${r.title}</h2>
   <p class="muted small" style="margin:0 0 6px">Bạn chọn: ${r.label}</p><p style="margin:0">${r.out}</p>
   <p class="squeeze">Tiền mặt và tiết kiệm còn ${fmt(liquid())}${debtTotal()>0?`, tổng nợ ${fmt(debtTotal())}`:""}.</p>
   ${r.impact?`<h3>Tác động của quyết định</h3>${impactHTML(r.impact)}${r.impact.why.length?`<ul class="why">${r.impact.why.map(w=>`<li>${w}</li>`).join("")}</ul>`:""}`:""}
   <div class="lesson"><b>Bài học</b><br>${r.lesson}</div>
   ${(s.queue||[]).length?`<button class="primary" data-act="nextev">Chuyện tiếp theo (còn ${s.queue.length})</button>`:`<button class="primary" data-act="next">${s.q+1>=s.totalQ?"Xem kết quả":"Sang quý tiếp"}</button>`}</div>`;
}
function chartView(){
  const h=[...s.history];if(s.phase!=="end")h.push(nw());
  const W=320,H=140,P=8,maxV=Math.max(1,...h),minV=Math.min(0,...h);
  const x=i=>P+i/s.totalQ*(W-2*P),y=v=>H-P-(v-minV)/(maxV-minV||1)*(H-2*P);
  return `<div class="panel"><h2>Tài sản ròng theo thời gian</h2><svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Biểu đồ tài sản ròng">
   <line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
   <polyline points="${h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--save)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="3.5" fill="var(--save)"/></svg></div>`;
}
const logView=()=>s.log.length?`<div class="panel"><h2>Nhật ký</h2><ul class="log">${s.log.slice(0,8).map(l=>`<li>${l}</li>`).join("")}</ul></div>`:"";
function endView(){
  const t=tierOf(),climb=Math.max(0,t-s.startTier);
  const score=Math.round(t/6*55+climb/6*25+s.happy/10+Math.min(10,s.knowledge));
  const verdict=climb>=3?"Bạn đã thay đổi vận mệnh tài chính của mình.":climb>=1?"Bạn đã tiến lên, hành trình vẫn còn tiếp.":"Lần này chưa leo được bậc nào. Thử chiến lược khác nhé.";
  return `<div class="panel"><div class="small muted">Điểm của bạn</div><div class="score">${score}/100</div>
   <h2 style="margin-top:6px">${RUNGS[s.startTier]} → ${RUNGS[t]}</h2><p style="margin-top:0">${verdict}</p>
   <ul class="endlist"><li>Tài sản ròng: ${fmt(nw())}${s.priceIdx>1?`, tương đương ${fmt(nw()/s.priceIdx)} theo sức mua lúc bắt đầu`:""}</li>
    <li>Tổng tiền lãi đã trả cho các khoản nợ: ${fmt(s.stats.interest)}</li>
    <li>Lợi nhuận từ nghề tay trái và kinh doanh: ${fmt(s.stats.bizProfit)}</li>
    <li>Hạnh phúc ${Math.round(s.happy)}/100, kiến thức ${s.knowledge} điểm</li></ul>
   ${s.lessons.length?`<h3>Những bài học bạn đã gặp</h3><ul class="endlist">${s.lessons.slice(-6).map(l=>`<li>${l}</li>`).join("")}</ul>`:""}
   ${decisionReview()}
   <button class="primary" data-act="reset" style="margin-top:12px">Chơi ván mới</button></div>`;
}
const foot=()=>`<footer>Trò chơi mang tính giáo dục, số liệu là giả lập, không phải lời khuyên đầu tư.<br>Mã người chơi: ${PID.slice(0,8)}. Gửi dữ liệu ẩn danh: <button class="ghost" data-act="consent" style="padding:2px 10px">${consent?"Đang bật":"Đang tắt"}</button></footer>`;
function render(){
  const app=document.getElementById("app");
  const head=`<header><h1>Hành trình tài chính</h1>${s?`<button class="ghost" data-act="${resetArmed?"reset":"arm"}">${resetArmed?"Bấm lần nữa để xóa ván":"Ván mới"}</button>`:""}</header>`;
  if(!s){app.innerHTML=head+startView()+foot();return}
  const main=s.phase==="plan"?planView():s.phase==="event"?eventView():s.phase==="result"?resultView():endView();
  app.innerHTML=head+statusView()+(s.phase==="end"?main+healthView():healthView()+main)+chartView()+logView()+foot();
  if(s.phase==="plan")updatePreview();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;if(a!=="arm")resetArmed=false;
  if(s&&["startsrc","startloan","close","manage","quit","rejoin","part","study","studyloan","dropstudy","auto","sell","life","reset"].includes(a))track("action",{a,v:v&&v.length>20?(findSrc(v)?findSrc(v).id:"src"):v,q:s.q,nw:Math.round(nw())});
  switch(a){
    case "pick":cfg[b.dataset.g]=v;render();break;
    case "start":newGame();break;
    case "consent":consent=!consent;try{localStorage.setItem("htc-consent",consent?"1":"0")}catch(err){}render();break;
    case "life":s.life=v;save();render();break;
    case "auto":s.autoSave=!s.autoSave;log(s.autoSave?"Bật tự động trích tiền.":"Tắt tự động trích tiền.");save();render();break;
    case "confirm":ui.shop=false;confirmPlan();break;
    case "choose":choose(+v);break;
    case "next":nextQuarter();break;
    case "nextev":if(startNextEvent()){save();render();window.scrollTo({top:0})}else nextQuarter();break;
    case "sell":if(v==="gold"){s.cash+=goldVal();s.goldUnits=0}else{s.cash+=stockVal();s.stockUnits=0}log(v==="gold"?"Bán hết vàng.":"Bán hết quỹ ETF.");save();render();break;
    case "shop":ui.shop=!ui.shop;render();break;
    case "startsrc":startSource(v,false,b.dataset.t!=null?+b.dataset.t:1);break;
    case "tier":{const x=findSrc(v);if(x){x.tier=((x.tier??1)+1)%3;log(`Đổi “${T(x).name}” sang mức ${TIERS[x.tier].label.toLowerCase()}.`)}save();render();break}
    case "fam":s.famSend=Math.max(0,(s.famSend||0)+(+v)*.5*M);save();render();break;
    case "startloan":startSource(v,true);break;
    case "manage":{const x=findSrc(v);if(x){x.managed=true;log(`Thuê quản lý cho “${T(x).name}”.`)}save();render();break}
    case "close":{const x=findSrc(v);if(x){const val=bizValue(x);s.cash+=val;s.sources=s.sources.filter(y=>y.uid!==v);log(val>0?`Bán “${T(x).name}”, thu ${fmt(val)}.`:`Dừng “${T(x).name}”.`)}save();render();break}
    case "quit":s.job.last=s.job.salary;s.job.employed=false;s.job.extraTime=0;log("Nghỉ việc làm thuê.");save();render();break;
    case "part":if(s.job.part){s.job.part=false;s.job.salary*=2;log("Chuyển sang làm toàn thời gian.")}else{s.job.part=true;s.job.salary*=.5;log("Chuyển sang làm bán thời gian.")}save();render();break;
    case "studyshop":ui.study=!ui.study;render();break;
    case "study":case "studyloan":s.study={id:v,progress:0,loan:a==="studyloan"};ui.study=false;log(`Bắt đầu học “${PROGRAMS[v].name}”${a==="studyloan"?" bằng vốn vay học tập":""}.`);save();render();break;
    case "dropstudy":if(s.study){log(`Bỏ học “${PROGRAMS[s.study.id].name}” giữa chừng. Học phí đã đóng không lấy lại được.`);if(s.study.id==="daihoc")s.support=0;s.study=null;s.will=Math.max(10,(s.will??55)-5)}save();render();break;
    case "rejoin":s.job.salary=s.job.last*.9;s.job.employed=true;log("Đi làm lại.");save();render();break;
    case "arm":resetArmed=true;render();break;
    case "reset":s=null;try{localStorage.removeItem(KEY)}catch(err){}render();window.scrollTo({top:0});break;
  }
});
document.addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(f){cfg.custom[f]=Math.max(0,parseFloat(e.target.value)||0);return}
  const k=e.target.dataset&&e.target.dataset.k;if(!k||!s)return;
  let v=+e.target.value;const others=Object.entries(s.alloc).filter(([kk])=>kk!==k).reduce((t,[,x])=>t+x,0);
  if(v+others>100){v=100-others;e.target.value=v}s.alloc[k]=v;updatePreview();save();
});
load();render();
</script>
</body>
</html>
